apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 15Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0c7223d249ae50e9a
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginxapp
  labels:
    purpose: ebsstaticdemo
    project: roboshop
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1c
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: ebs-static
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb-service
  labels:
    purpose: ebsstaticdemo
spec:
  type: LoadBalancer
  selector:
    purpose: ebsstaticdemo
    project: roboshop
  ports:
    - protocol: TCP
      port: 80 #service port
      targetPort: 80 #container port (nginx opens 80 container port)
