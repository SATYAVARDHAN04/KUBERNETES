apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-dynamic
  labels:
    purpose: efsdynamicdemo
    project: roboshop
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: roboshop-efs
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginxapp
  labels:
    purpose: efsdynamicdemo
    project: roboshop
spec:
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: efs-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb-service
  labels:
    purpose: efsdynamicdemo
    project: roboshop
spec:
  type: LoadBalancer
  selector:
    purpose: efsdynamicdemo
    project: roboshop
  ports:
    - protocol: TCP
      port: 80 #service port
      targetPort: 80 #container port (nginx opens 80 container port)
