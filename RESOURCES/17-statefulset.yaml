apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-headless
  labels:
    purpose: efsdynamicdemo
    project: roboshop
spec:
  ports:
    - port: 80
      name: web
  clusterIP: None
  selector:
    purpose: efsdynamicdemo
    project: roboshop
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-normal
  labels:
    purpose: efsdynamicdemo
    project: roboshop
spec:
  ports:
    - port: 80
      name: web
  selector:
    purpose: efsdynamicdemo
    project: roboshop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-statefulset
spec:
  selector:
    matchLabels:
      purpose: efsdynamicdemo
      project: roboshop # has to match .spec.template.metadata.labels
  serviceName: "nginx-svc-headless" # this should be headless service
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        purpose: efsdynamicdemo
        project: roboshop # has to match .spec.selector.matchLabels
    spec:
      containers:
        - name: nginx
          image: nginx
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
  # This is nothing but PVC, you can directly create here
  volumeClaimTemplates:
    - metadata:
        name: www
        labels:
          purpose: efsdynamicdemo
          project: roboshop
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "roboshop-efs"
        resources:
          requests:
            storage: 2Gi
