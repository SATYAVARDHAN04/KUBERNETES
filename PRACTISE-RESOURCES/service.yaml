apiVersion: v1
kind: Service
metadata:
  name: serviceexample
  labels:
    purpose: newserviceexample
spec:
  selector:
    name: exampleservice
    tier: backend
    reason: productdisplay
  port:
    - protocol: TCP
      port: 80
      targetport: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: podendpoint
  labels:
    name: exampleservice
    tier: backend
    reason: productdisplay
spec:
  containers:
    - name: nginx
      image: nginx 